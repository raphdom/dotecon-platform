<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DotEcon Online</title>
  <meta name="description" content="Education and tools that empower any developer to build production-grade software with excellence.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #ffffff;
      color: #171717;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container { max-width: 640px; text-align: center; }
    .badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #4b5563;
      font-size: 0.875rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(2.25rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #111827;
      margin-bottom: 1rem;
      line-height: 1.1;
    }
    p {
      font-size: 1.2rem;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    a.btn {
      display: inline-block;
      background: #111827;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: background 0.15s;
    }
    a.btn:hover { background: #1f2937; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Coming soon</div>
    <h1>DotEcon Online</h1>
    <p>
      Education and tools that empower any developer to build
      production-grade software — with AI as a force multiplier,
      not a shortcut.
    </p>
    <a class="btn" href="mailto:hello@doteconline.com">Get notified at launch</a>
  </div>
</body>
</html>
